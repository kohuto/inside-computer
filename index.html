<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fa">
  <meta name="description" content="Názorně a krok za krokem: spolupráce hardwaru při zapnutí počítače, spuštění kalkulačky, přehrávání videa a ukládání souboru.">
  <title>Uvnitř počítače · Jak spolupracuje hardware</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script defer src="js/scenarios.js"></script>
  <script defer src="js/diagram.js"></script>
  <script defer src="js/player.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <main class="workspace">
    <section class="settings" aria-label="Nastavení průvodce">
      <fieldset class="scenario-picker"><legend>Vyberte činnost</legend><div id="scenario-options"></div></fieldset>
    </section>

    <section class="lab" aria-labelledby="scenario-title">
      <div class="lab-heading">
        <div class="scenario-heading">
          <h1 id="scenario-title">Spuštění kalkulačky</h1>
          <fieldset class="graphics-picker">
            <legend class="visually-hidden">Typ grafiky</legend>
            <label class="graphics-choice" title="Grafika sdílí systémovou paměť RAM"><input type="radio" name="graphics" id="integrated-graphics" value="integrated" aria-controls="diagram-container" checked><span>Integrovaná</span></label>
            <label class="graphics-choice" title="Grafická karta používá vlastní paměť VRAM"><input type="radio" name="graphics" id="dedicated-graphics" value="dedicated" aria-controls="diagram-container"><span>Dedikovaná</span></label>
          </fieldset>
        </div>
        <div class="playback-controls" role="group" aria-label="Ovládání animace">
          <button class="play-button" id="play" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg><span>Spustit</span></button>
          <button class="control-button" id="next" type="button" title="Přehrát jeden krok a zastavit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 5 10 7-10 7ZM19 5v14"/></svg><span>Další krok</span></button>
          <button class="control-button reset-button" id="reset" type="button" title="Vrátit scénář na začátek" aria-label="Vrátit scénář na začátek"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></svg><span>Od začátku</span></button>
        </div>
      </div>
      <p class="diagram-scroll-hint">↔ Schéma můžete posunout do stran.</p>
      <div class="diagram-area" id="diagram-container"></div>
      <div class="step-area explanation-hidden" id="step-area">
        <div class="visualization-toggles">
          <label class="explanation-toggle"><input type="checkbox" id="show-explanation" aria-controls="explanation"><span class="switch" aria-hidden="true"></span><span>Zobrazit vysvětlení</span></label>
        </div>
        <div class="step-content" id="explanation" hidden>
          <div class="step-line"><span class="step-label" id="step-count">VÝCHOZÍ STAV</span><span class="step-track" id="step-track" aria-hidden="true"></span></div>
          <div class="explanation" aria-live="polite" aria-atomic="true"><h3 id="step-title"></h3><p id="step-description"></p></div>
        </div>
      </div>
    </section>
  </main>
  <noscript>Pro animaci a ovládání je potřeba zapnout JavaScript.</noscript>
</body>
</html>
